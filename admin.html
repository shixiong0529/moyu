<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>摸鱼社区 · 管理后台</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }

    /* ── Admin design system ─────────────────────────────────────── */
    .adm-shell { display: flex; width: 100%; height: 100%; overflow: hidden; background: var(--paper-0); color: var(--ink-0); }

    .adm-sidebar { width: 216px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--paper-1); border-right: 1px solid var(--paper-2); }
    .adm-brand { padding: 22px 20px 16px; border-bottom: 1px solid var(--paper-2); display: flex; align-items: center; gap: 10px; }
    .adm-brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0; }
    .adm-brand-title { font-size: 15px; font-weight: 700; color: var(--ink-0); line-height: 1.3; }
    .adm-brand-sub { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }
    .adm-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
    .adm-nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 14.5px; color: var(--ink-1); margin-bottom: 2px; transition: background .12s ease, color .12s ease; user-select: none; }
    .adm-nav-item:hover { background: var(--paper-2); color: var(--ink-0); }
    .adm-nav-item.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .adm-nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
    .adm-sidebar-footer { padding: 14px 16px; border-top: 1px solid var(--paper-2); display: flex; align-items: center; gap: 10px; }
    .adm-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--paper-2); color: var(--ink-0); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .adm-sidebar-footer-name { font-size: 13px; color: var(--ink-0); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .adm-logout-btn { background: none; border: none; color: var(--ink-2); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 6px; flex-shrink: 0; transition: background .12s ease, color .12s ease; }
    .adm-logout-btn:hover { background: var(--paper-2); color: #ef6a6e; }

    .adm-main { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .adm-main::-webkit-scrollbar { width: 10px; }
    .adm-main::-webkit-scrollbar-thumb { background: var(--paper-3); border-radius: 6px; }
    .adm-main::-webkit-scrollbar-track { background: transparent; }

    .adm-page { max-width: 1180px; margin: 0 auto; padding: 30px 36px 56px; }
    .adm-page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    .adm-title-row { display: flex; align-items: center; gap: 12px; }
    .adm-title { font-size: 21px; font-weight: 700; color: var(--ink-0); margin: 0; }
    .adm-subtitle { font-size: 13px; color: var(--ink-2); margin-top: 5px; }
    .adm-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .adm-panel { background: var(--paper-1); border: 1px solid var(--paper-2); border-radius: 14px; padding: 20px 22px; }
    .adm-panel + .adm-panel { margin-top: 16px; }
    .adm-panel-title { font-weight: 700; font-size: 14.5px; margin-bottom: 14px; color: var(--ink-0); }
    .adm-panel-hint { font-size: 12.5px; color: var(--ink-2); margin-top: -8px; margin-bottom: 12px; }

    .adm-table-wrap { background: var(--paper-1); border: 1px solid var(--paper-2); border-radius: 14px; overflow: hidden; overflow-x: auto; }
    .adm-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
    .adm-table thead th { text-align: left; padding: 11px 18px; background: var(--paper-2); color: var(--ink-2); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    .adm-table tbody tr { border-top: 1px solid var(--paper-2); transition: background .12s ease; }
    .adm-table tbody tr.clickable { cursor: pointer; }
    .adm-table tbody tr.clickable:hover { background: var(--paper-2); }
    .adm-table td { padding: 11px 18px; vertical-align: middle; color: var(--ink-0); }
    .adm-table-empty { padding: 44px; text-align: center; color: var(--ink-2); font-size: 14px; }

    .adm-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; padding: 9px 18px; cursor: pointer; transition: filter .12s ease, transform .05s ease, opacity .12s ease, background .12s ease; background: var(--accent); color: var(--accent-ink); white-space: nowrap; font-family: inherit; }
    .adm-btn:hover:not(:disabled) { filter: brightness(1.1); }
    .adm-btn:active:not(:disabled) { transform: scale(.97); }
    .adm-btn:disabled { opacity: .5; cursor: not-allowed; }
    .adm-btn.ghost { background: transparent; color: var(--ink-1); border: 1px solid var(--paper-3); }
    .adm-btn.ghost:hover:not(:disabled) { background: var(--paper-2); color: var(--ink-0); }
    .adm-btn.ghost.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .adm-btn.danger { background: #e5484d; color: #fff; }
    .adm-btn.small { padding: 5px 12px; font-size: 12.5px; border-radius: 6px; }

    .adm-field { margin-bottom: 13px; }
    .adm-field label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 5px; font-weight: 600; }
    .adm-input, .adm-select, .adm-textarea { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--paper-3); background: var(--paper-0); color: var(--ink-0); font-size: 14.5px; box-sizing: border-box; transition: border-color .12s ease, box-shadow .12s ease; font-family: inherit; }
    .adm-input:focus, .adm-select:focus, .adm-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .adm-input:disabled, .adm-select:disabled, .adm-textarea:disabled { opacity: .45; cursor: not-allowed; background: var(--paper-1); }
    .adm-textarea { resize: vertical; }

    .adm-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--paper-2); color: var(--ink-1); line-height: 1.6; white-space: nowrap; }
    .adm-badge.ok { background: color-mix(in srgb, #3dc96e 22%, transparent); color: #4cd486; }
    .adm-badge.danger { background: color-mix(in srgb, #e5484d 22%, transparent); color: #f0787c; }
    .adm-badge.accent { background: var(--accent); color: var(--accent-ink); }

    .adm-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
    .adm-stat-card { background: var(--paper-1); border: 1px solid var(--paper-2); border-radius: 14px; padding: 20px; transition: transform .12s ease, border-color .12s ease; }
    .adm-stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .adm-stat-value { font-size: 30px; font-weight: 800; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .adm-stat-label { font-size: 13px; color: var(--ink-2); margin-top: 8px; }

    .adm-detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .adm-detail-cell { background: var(--paper-1); border: 1px solid var(--paper-2); border-radius: 10px; padding: 12px 16px; }
    .adm-detail-label { font-size: 12px; color: var(--ink-2); }
    .adm-detail-value { font-size: 15px; margin-top: 4px; color: var(--ink-0); word-break: break-word; }

    .adm-flash { margin-bottom: 16px; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; border: 1px solid transparent; }
    .adm-flash.ok { background: color-mix(in srgb, #3dc96e 14%, transparent); color: #4cd486; border-color: color-mix(in srgb, #3dc96e 30%, transparent); }
    .adm-flash.error { background: color-mix(in srgb, #e5484d 14%, transparent); color: #f0787c; border-color: color-mix(in srgb, #e5484d 30%, transparent); }

    .adm-pager { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
    .adm-pager-info { font-size: 12.5px; color: var(--ink-2); }

    .adm-filter-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .adm-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .adm-chip { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; background: var(--paper-2); color: var(--ink-1); transition: background .12s ease, color .12s ease; }
    .adm-chip.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

    .adm-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .adm-modal { background: var(--paper-1); border: 1px solid var(--paper-2); border-radius: 16px; padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .adm-modal-title { font-weight: 700; font-size: 16px; margin-bottom: 18px; color: var(--ink-0); }

    .adm-login-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--paper-0); background-image: radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 55%); }
    .adm-login-card { width: 340px; background: var(--paper-1); border: 1px solid var(--paper-2); border-radius: 16px; padding: 34px 30px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="admin.jsx"></script>
</body>
</html>
